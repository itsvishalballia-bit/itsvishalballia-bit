name: Generate Snake Animation

on:
  schedule:
    # Every 12 hours, so the snake stays in sync with new contributions
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Build the snake from the contribution graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#7F00FF
            dist/snake-dark.svg?palette=github-dark&color_snake=#7F00FF
            dist/snake.gif?color_snake=#7F00FF&color_dots=#161B22,#2E1065,#5B21B6,#7F00FF,#A855F7

      - name: Push the animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
